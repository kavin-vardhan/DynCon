[/Script/Engine.RendererSettings]
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
; Lumen software ray tracing: Detail Tracing (per-mesh distance fields near the camera), not
; Global Tracing (the global distance field only).
;
; Global Tracing hangs this PC's GPU. It survived brief 004 because the art was then imported
; at metre scale, which made every mesh's distance field a handful of voxels - there was
; almost nothing to trace. With the art at true centimetres the distance fields came out at
; full resolution for the first time, and composing them into the global field every time a
; piece is spawned pushed the GPU past its watchdog: a packaged run froze for ~70 s and then
; died with exit code 3, leaving nvlddmkm "GPU engine reset" entries in the Windows system
; log. Every piece over about 12,000 triangles did it; it went away at half resolution, which
; is what pointed at GPU cost rather than at the content.
r.Lumen.TraceMeshSDFs=1
r.Shadow.Virtual.Enable=1
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=true
r.AllowStaticLighting=False


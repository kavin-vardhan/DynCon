[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=(A=-502348264,B=1154045573,C=658303913,D=-22052401)
ProjectName=DC Demo
ProjectVersion=0.1.0

; Content packs = cook chunks (unreal_spec_v1 section 1).
;
; Every /Game/DCContent/<id>_<v>/ folder holds a PrimaryAssetLabel whose rules put that folder
; in its own chunk (ChunkId 100 + n). One packaging run therefore produces the base game as
; chunk 0 plus one pakchunk1NN-Windows.{pak,utoc,ucas} set per piece-version, all cooked
; against this exact build. The chunk files are then moved out of the staged build into
; unreal\_packs\ so the shipped build genuinely does not carry the content.
;
; MapsToCook is deliberately just the maps this project has of its own: /Game/Maps/Spike
; (brief 006's pack round-trip map), /Game/Maps/DCRuntime (brief 011's three-slot test map for
; the runtime client) and the demo's two real maps, /Game/Maps/GameA and /Game/Maps/GameB
; (brief 012). The third-person template's variant maps
; (Combat / Platforming / SideScrolling) are not part of the demo and the shared Characters
; content pack was not copied into the project, so cooking them would be slow and noisy.
[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
BuildTarget=DCDemo
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
bGenerateChunks=True
bGenerateNoChunks=False
bChunkHardReferencesOnly=False
bForceOneChunkPerFile=False
MaxChunkSize=0
bBuildHttpChunkInstallData=False
bCompressed=True
bShareMaterialShaderCode=True
bSharedMaterialNativeLibraries=False
bCookAll=False
bCookMapsOnly=False
bSkipEditorContent=False
+MapsToCook=(FilePath="/Game/Maps/Spike")
+MapsToCook=(FilePath="/Game/Maps/DCRuntime")
+MapsToCook=(FilePath="/Game/Maps/GameA")
+MapsToCook=(FilePath="/Game/Maps/GameB")
+DirectoriesToAlwaysCook=(Path="/Game/DCCore")
+DirectoriesToAlwaysCook=(Path="/Game/DCContent")
; The Player. ADCRuntimeGameMode names the pawn and the controller by *soft* path so the
; plugin keeps no link dependency on the game module, and the cooker does not follow a soft
; path - so both folders have to be named here or the packaged game falls back to a
; DefaultPawn with no mesh.
+DirectoriesToAlwaysCook=(Path="/Game/Player")
+DirectoriesToAlwaysCook=(Path="/Game/Mannequin")

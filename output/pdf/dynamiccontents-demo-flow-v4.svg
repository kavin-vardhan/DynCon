<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1666" viewBox="0 0 900 1666" role="img" aria-labelledby="title desc">
<title id="title">DynamicContents v4 demo flowchart</title>
<desc id="desc">Follow eight steps from starting the stamp rally, booking a venue, playing, updating without losing progress, and booking expiry to the next visitor.</desc>
<rect x="0" y="0" width="900" height="1666" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="48" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00776C" text-anchor="start">DYNAMICCONTENTS  /  TOKYO DEMO  /  V4</text>
<text x="48" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#183448" text-anchor="start">How the demo unfolds</text>
<text x="48" y="133" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="#526879" text-anchor="start">One street. Two controllers. About five minutes.</text>
<text x="48" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#245EB3" text-anchor="start">PLAYER</text>
<text x="118" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Play a stamp rally</text>
<text x="457" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#00776C" text-anchor="start">BRAND</text>
<text x="525" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Book venues with demo credits</text>
<text x="48" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#526879" text-anchor="start">Demo clock: 1 demo hour = 1 real minute</text>
<text x="682" y="213" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#526879" text-anchor="start">Planned experience</text>
<rect x="155" y="245" width="697" height="125" rx="14" fill="#F1F5F8" stroke="#C9D5DE" stroke-width="1.4"/>
<text x="48" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">0:00</text>
<text x="174" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#245EB3" text-anchor="start">01</text>
<text x="216" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#245EB3" text-anchor="start">PLAYER</text>
<text x="216" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">Start the stamp rally</text>
<text x="216" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Pick a profile. Collect tokens and earn stamps by playing activities inside</text>
<text x="216" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">venues.</text>
<line x1="503.5" y1="376" x2="503.5" y2="398" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="398" x2="497.5" y2="390" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="398" x2="509.5" y2="390" stroke="#8296A5" stroke-width="2.5"/>
<rect x="155" y="405" width="697" height="125" rx="8" fill="#FFFFFF" stroke="#C9D5DE" stroke-width="1.4"/>
<text x="48" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">0:30</text>
<text x="174" y="438" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#00776C" text-anchor="start">02</text>
<text x="216" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#00776C" text-anchor="start">BRAND</text>
<text x="216" y="458" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">Book a place on the street</text>
<text x="216" y="485" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Compare footfall and bids. Choose a slot, building and hours. Checks pass;</text>
<text x="216" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">win a 3-hour booking.</text>
<line x1="503.5" y1="536" x2="503.5" y2="558" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="558" x2="497.5" y2="550" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="558" x2="509.5" y2="550" stroke="#8296A5" stroke-width="2.5"/>
<rect x="155" y="565" width="697" height="125" rx="8" fill="#FFFFFF" stroke="#C9D5DE" stroke-width="1.4"/>
<text x="48" y="611" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">1:30</text>
<text x="174" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#245EB3" text-anchor="start">03</text>
<text x="216" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#245EB3" text-anchor="start">PLAYER</text>
<text x="216" y="618" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">A new venue appears</text>
<text x="216" y="645" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Follow the “new venue” ping. Walk in and explore. The game carries on</text>
<text x="216" y="670" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">without a loading screen.</text>
<line x1="503.5" y1="696" x2="503.5" y2="718" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="718" x2="497.5" y2="710" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="718" x2="509.5" y2="710" stroke="#8296A5" stroke-width="2.5"/>
<rect x="155" y="725" width="697" height="125" rx="8" fill="#FFFFFF" stroke="#C9D5DE" stroke-width="1.4"/>
<text x="48" y="771" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">2:15</text>
<text x="174" y="758" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#245EB3" text-anchor="start">04</text>
<text x="216" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#245EB3" text-anchor="start">PLAYER + BRAND</text>
<text x="216" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">Play the activity. See the results.</text>
<text x="216" y="805" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Player works toward a stamp. Brand watches live views, visits and time spent</text>
<text x="216" y="830" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">in the venue.</text>
<line x1="503.5" y1="856" x2="503.5" y2="878" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="878" x2="497.5" y2="870" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="878" x2="509.5" y2="870" stroke="#8296A5" stroke-width="2.5"/>
<rect x="155" y="885" width="697" height="125" rx="8" fill="#EAF6F2" stroke="#00776C" stroke-width="1.4"/>
<text x="48" y="931" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">3:15</text>
<text x="174" y="918" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#00776C" text-anchor="start">05</text>
<text x="216" y="910" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#00776C" text-anchor="start">BRAND</text>
<text x="216" y="938" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">Send the Season 2 update</text>
<text x="216" y="965" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Player is still inside, at 3 of 5 tokens. The update waits until the Player leaves.</text>
<line x1="503.5" y1="1016" x2="503.5" y2="1038" stroke="#00776C" stroke-width="2.5"/>
<line x1="503.5" y1="1038" x2="497.5" y2="1030" stroke="#00776C" stroke-width="2.5"/>
<line x1="503.5" y1="1038" x2="509.5" y2="1030" stroke="#00776C" stroke-width="2.5"/>
<rect x="155" y="1045" width="697" height="125" rx="8" fill="#EAF6F2" stroke="#00776C" stroke-width="1.4"/>
<text x="48" y="1091" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start"></text>
<text x="174" y="1078" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#00776C" text-anchor="start">06</text>
<text x="216" y="1070" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#00776C" text-anchor="start">PLAYER</text>
<text x="216" y="1098" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">Walk out, then back in</text>
<text x="216" y="1125" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Season 2 replaces the venue after exit.</text>
<text x="216" y="1150" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Progress is still 3 of 5 tokens.</text>
<line x1="503.5" y1="1176" x2="503.5" y2="1198" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="1198" x2="497.5" y2="1190" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="1198" x2="509.5" y2="1190" stroke="#8296A5" stroke-width="2.5"/>
<rect x="155" y="1205" width="697" height="125" rx="8" fill="#FFFFFF" stroke="#C9D5DE" stroke-width="1.4"/>
<text x="48" y="1251" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">4:30</text>
<text x="174" y="1238" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#245EB3" text-anchor="start">07</text>
<text x="216" y="1230" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#245EB3" text-anchor="start">PLAYER + BRAND</text>
<text x="216" y="1258" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">The booking runs out</text>
<text x="216" y="1285" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">The next auction brings back the original venue.</text>
<text x="216" y="1310" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Earned stamps stay; the swap waits if the Player is inside.</text>
<line x1="503.5" y1="1336" x2="503.5" y2="1358" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="1358" x2="497.5" y2="1350" stroke="#8296A5" stroke-width="2.5"/>
<line x1="503.5" y1="1358" x2="509.5" y2="1350" stroke="#8296A5" stroke-width="2.5"/>
<rect x="155" y="1365" width="697" height="125" rx="14" fill="#F1F5F8" stroke="#C9D5DE" stroke-width="1.4"/>
<text x="48" y="1411" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#526879" text-anchor="start">END</text>
<text x="174" y="1398" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#245EB3" text-anchor="start">08</text>
<text x="216" y="1390" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#245EB3" text-anchor="start">BOOTH</text>
<text x="216" y="1418" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#183448" text-anchor="start">Reset for the next visitor</text>
<text x="216" y="1445" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Reset the booking, credits, stamps and progress.</text>
<text x="216" y="1470" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#183448" text-anchor="start">Return to the idle street with the game still running.</text>
<rect x="48" y="1551" width="804" height="46" rx="7" fill="#183448" stroke="none" stroke-width="1"/>
<text x="450" y="1581" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">The building changes. The Player keeps playing.</text>
<text x="48" y="1622" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#526879" text-anchor="start">Main route shown. Times are approximate; the booking lasts 3 real minutes from the win.</text>
<text x="48" y="1646" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#526879" text-anchor="start">Source: DynamicContents_Tokyo_demo_plan_v4.md</text>
</svg>